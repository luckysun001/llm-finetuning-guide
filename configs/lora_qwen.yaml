# LoRA 微调示例配置
# 用法: python scripts/cli.py train --config configs/lora_qwen.yaml
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
model_type: causal_lm
finetuning_method: lora
quantization_level: bf16

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

training:
  output_dir: ./checkpoints/lora-qwen
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_steps: 100
  bf16: true
  save_strategy: epoch

data:
  dataset_path: datasets/sample_instructions.jsonl
  text_column: text
  max_seq_length: 1024

evaluation:
  metrics: ["perplexity"]
  max_new_tokens: 128
