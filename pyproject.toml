[tool.poetry]
name = "llm-finetuning-guide"
version = "1.0.0"
description = "大模型微调开源学习项目 - 从入门到精通"
authors = ["AI Learning Lab"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/luckysun001/llm-finetuning-guide"
keywords = ["llm", "fine-tuning", "machine-learning", "nlp", "deep-learning", "lora", "qlora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = { version = "^2.0", optional = true }
transformers = { version = "^4.35", optional = true }
datasets = { version = "^2.14", optional = true }
peft = { version = "^0.6", optional = true }
bitsandbytes = { version = "^0.41", optional = true }
accelerate = { version = "^0.24", optional = true }
trl = { version = "^0.7", optional = true }
evaluate = { version = "^0.4", optional = true }

# 数据处理和可视化
pandas = "^2.0"
numpy = "^1.24"
matplotlib = "^3.7"
seaborn = "^0.12"
plotly = "^5.17"

# 工具库
tqdm = "^4.66"
pyyaml = "^6.0"
python-dotenv = "^1.0"
wandb = { version = "^0.15", optional = true }
tensorboard = { version = "^2.14", optional = true }

# Jupyter 和 notebook 支持
jupyter = { version = "^1.0", optional = true }
ipywidgets = { version = "^8.1", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
black = "^24.0"
ruff = "^0.1"
mypy = "^1.6"

[tool.poetry.extras]
full = ["torch", "transformers", "datasets", "peft", "bitsandbytes", "accelerate", "trl", "evaluate", "wandb", "tensorboard", "jupyter", "ipywidgets"]
minimal = ["torch", "transformers", "datasets", "peft"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
